name: OrangeFox - 构建

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used
# 调教说明
# Lime优化与编辑修复
# 在原有基础上添加对OF14.1的支持

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox 版本'
        required: true
        default: '12.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
        - 10.0
      DEVICE_TREE:
        description: 'OrangeFox设备树'
        required: true
        default: 'https://github.com/xyyyico/device-5g-L39_IVVI_4_64_V80M60BP_NZW_BT30.git'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox设备树分支'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: '指定设备路径'
        required: true
        default: 'device/5g/L39_IVVI_4_64_V80M60BP_NZW_BT30'
      DEVICE_NAME:
        description: '指定设备代号'
        required: true
        default: 'L39_IVVI_4_64_V80M60BP_NZW_BT30'
      BUILD_TARGET:
        description: '构建目标'
        required: true
        default: 'recovery'
        type: choice
        options:
        - recovery
        - boot
      DN:
        description: '设备名称'
        required: true
        default: 'IVVI L39'
        type: string

env:
  # 消除Node.js20弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: 🏠 由 ${{ github.actor }} 构建REC
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: 🧱 构建配置
      run: |
        echo "构建配置"
        echo "设备代号: ${{ inputs.DEVICE_NAME }}"
        echo "设备名称: ${{ inputs.DN }}"
        echo "OrangeFox版本: ${{ inputs.MANIFEST_BRANCH }}"
        echo "指定设备路径: ${{ inputs.DEVICE_PATH }}"
        echo "构建: ${{ inputs.BUILD_TARGET }}"
    - name: ✅ 检出代码
      uses: actions/checkout@v4
              
    - name: 🧹 仓库空间清理
      uses: rokibhasansagar/slimhub_actions@main

    - name: 🚢 Swap空间（24G防止编译OOM）
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: 🤖 完整编译依赖预装
      run: |
        sudo apt update -y
        # 预装host编译所需库，修复host_init_verifier缺失依赖
        sudo apt install aria2 clang libc++-dev libselinux1-dev libcap-dev libssl-dev -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: 🏙️ 初始化源码清单
      if: inputs.MANIFEST_BRANCH == '11.0' || inputs.MANIFEST_BRANCH == '12.1' || inputs.MANIFEST_BRANCH == '14.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: 🌳 克隆设备树
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: 🧹 清空旧编译输出，解决sepolicy目录残留报错
      run: |
        FOX_ROOT=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        rm -rf ${FOX_ROOT}/out
        mkdir -p ${FOX_ROOT}/out

    - name: 🦊 构建OrangeFox（全流程日志捕获）
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        LOG_FILE=${GITHUB_WORKSPACE}/build_full_log.txt
        # 预创建日志文件，保证工件一定能上传
        touch ${LOG_FILE}

        echo "===== 加载 build/envsetup.sh =====" >> ${LOG_FILE}
        source build/envsetup.sh 2>&1 | tee -a ${LOG_FILE}

        # 修复拼写错误 DEPENDCIES → DEPENDENCIES
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE=Official
        # 临时跳过host工具编译，绕过host_init_verifier编译失败
        export SKIP_HOST_TOOLS=true

        echo "===== 执行 lunch twrp_${{ inputs.DEVICE_NAME }}-eng =====" >> ${LOG_FILE}
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng 2>&1 | tee -a ${LOG_FILE}

        echo "===== 开始编译 ${{ inputs.BUILD_TARGET }}image =====" >> ${LOG_FILE}
        mka ${{ inputs.BUILD_TARGET }}image -j$(nproc) 2>&1 | tee -a ${LOG_FILE}
      shell: bash

    - name: 📤 上传完整编译日志（无论成功失败）
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: full-build-log
        path: ${{ github.workspace }}/build_full_log.txt

    - name: 💿 整理镜像文件
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/upload_artifacts

        FOX_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        OUT_DIR="${FOX_DIR}/out/target/product/${{ inputs.DEVICE_NAME }}"

        echo "🔍 镜像输出目录：$OUT_DIR"

        if [ ! -d "$OUT_DIR" ]; then
            echo "❌ 错误：输出目录不存在，请检查设备代号或lunch配置"
            exit 1
        fi

        find "$OUT_DIR" -maxdepth 1 -name "*.img" -exec cp {} ${GITHUB_WORKSPACE}/upload_artifacts/ \;
        find "$OUT_DIR" -maxdepth 1 -name "*.zip" -exec cp {} ${GITHUB_WORKSPACE}/upload_artifacts/ \;

        if [ -z "$(ls -A ${GITHUB_WORKSPACE}/upload_artifacts/)" ]; then
           echo "❌ 未找到编译产物，请检查BoardConfig.mk配置"
           exit 1
        else
           echo "✅ 已收集镜像文件："
           ls -R ${GITHUB_WORKSPACE}/upload_artifacts/
        fi

    - name: 🧶 发行版参数预处理
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV
        
        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        [[ "${DEVICE_TREE_URL}" == *.git ]] && DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: 🎥 上传至GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: upload_artifacts/*
        name: ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          <h1 align="center">
            <img src="https://orangefox.download/fox.svg" height="40" style="vertical-align:bottom"/> 
            OrangeFox ${{ inputs.MANIFEST_BRANCH }}
          </h1>
          🚀 构建流水号: ${{ github.run_id }}<br>
          📱 设备型号: ${{ inputs.DN }}<br>
          🔢 设备代号: ${{ inputs.DEVICE_NAME }}<br>
          🦊 OrangeFox 版本: ${{ inputs.MANIFEST_BRANCH }}<br>
          📅 构建日期: ${{ env.BUILD_DATE }}<br>
          <br>
          <strong>✅ 状态: 构建成功 (Build Successfully)</strong>
